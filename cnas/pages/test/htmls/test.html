  <button id="test2" onclick="test2()" class="button is-link">Test button 2</button>
  <button id="test3" onclick="test3()" class="button is-link">Test button 3</button>
  <button id="ls_command" onclick="lsCommand()" class="button is-info">ls command</button>
</div>

  <p class="is-size-7 has-text-weight-semibold mb-2">ls command 결과</p>

</div>
<script>
  function test1() {
    callPython("test_button1", "test1");
  }
  function test2() {
    callPython("test_button2", "test2", "test2");
  }
  function test3() {
    callPython("test_button3");
  }
  function lsCommand() {
    callPython("test_command");
  }
  function test3_callback() {
    alert("test3 callback");
  }
  window.test3_callback = test3_callback;
</script>
