<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 만들기 - CNAS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.3/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .signup-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .signup-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      padding: 2rem;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo i {
      font-size: 3rem;
      color: #667eea;
      margin-bottom: 1rem;
    }
    .field:not(:last-child) {
      margin-bottom: 1.5rem;
    }
    .button.is-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      transition: all 0.3s ease;
    }
    .button.is-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.125em rgba(102, 126, 234, 0.25);
    }
    .help-links {
      text-align: center;
      margin-top: 1.5rem;
    }
    .help-links a {
      color: #667eea;
      text-decoration: none;
      margin: 0 0.5rem;
      font-size: 0.9rem;
    }
    .help-links a:hover {
      text-decoration: underline;
    }
    .divider {
      margin: 1.5rem 0;
      text-align: center;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #dbdbdb;
    }
    .divider span {
      background: white;
      padding: 0 1rem;
      color: #7a7a7a;
      font-size: 0.9rem;
    }
    .password-requirements {
      font-size: 0.8rem;
      color: #7a7a7a;
      margin-top: 0.5rem;
    }
    .password-requirements ul {
      margin-left: 1rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <section class="hero is-fullheight">
      <div class="hero-body">
        <div class="container">
          <div class="columns is-centered">
            <div class="column is-4-desktop is-6-tablet">
              <div class="signup-box">
                <!-- 로고 및 제목 -->
                <div class="logo">
                  <i class="fas fa-user-plus"></i>
                  <h1 class="title has-text-centered has-text-grey-dark">계정 만들기</h1>
                  <p class="subtitle is-6 has-text-centered has-text-grey">새로운 CNAS 계정을 생성하세요</p>
                </div>

                <!-- 회원가입 폼 -->
                <form id="signupForm">
                  <!-- 이름 입력 필드 -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-user"></i>
                      </span>
                      이름
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="text" 
                        id="name"
                        placeholder="홍길동" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-user"></i>
                      </span>
                    </div>
                  </div>

                  <!-- 이메일 입력 필드 -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-envelope"></i>
                      </span>
                      이메일
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="email" 
                        id="email"
                        placeholder="example@email.com" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-envelope"></i>
                      </span>
                    </div>
                  </div>

                  <!-- 패스워드 입력 필드 -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-lock"></i>
                      </span>
                      비밀번호
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="password" 
                        id="password"
                        placeholder="••••••••" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-lock"></i>
                      </span>
                    </div>
                    <div class="password-requirements">
                      <p><strong>비밀번호 요구사항:</strong></p>
                      <ul>
                        <li>최소 8자 이상</li>
                        <li>영문, 숫자, 특수문자 조합</li>
                        <li>대소문자 포함</li>
                      </ul>
                    </div>
                  </div>

                  <!-- 패스워드 확인 입력 필드 -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-check-circle"></i>
                      </span>
                      비밀번호 확인
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="password" 
                        id="confirmPassword"
                        placeholder="••••••••" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-check-circle"></i>
                      </span>
                    </div>
                  </div>

                  <!-- 이용약관 동의 체크박스 -->
                  <div class="field">
                    <div class="control">
                      <label class="checkbox">
                        <input type="checkbox" id="agreeTerms" required>
                        <a href="#" class="has-text-primary">이용약관</a> 및 <a href="#" class="has-text-primary">개인정보처리방침</a>에 동의합니다
                      </label>
                    </div>
                  </div>

                  <!-- 회원가입 버튼 -->
                  <div class="field">
                    <div class="control">
                      <button type="submit" class="button is-primary is-fullwidth is-medium">
                        <span class="icon">
                          <i class="fas fa-user-plus"></i>
                        </span>
                        <span>계정 만들기</span>
                      </button>
                    </div>
                  </div>
                </form>

                <!-- 구분선 -->
                <div class="divider">
                  <span>또는</span>
                </div>

                <!-- 도움말 링크들 -->
                <div class="help-links">
                  <a href="login.html">
                    <span class="icon is-small">
                      <i class="fas fa-sign-in-alt"></i>
                    </span>
                    이미 계정이 있으신가요? 로그인
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- JavaScript -->
  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      
      // 비밀번호 확인
      if (password !== confirmPassword) {
        alert('비밀번호가 일치하지 않습니다.');
        return;
      }
      
      // 비밀번호 강도 검사
      if (password.length < 8) {
        alert('비밀번호는 최소 8자 이상이어야 합니다.');
        return;
      }
      
      // 이용약관 동의 확인
      if (!agreeTerms) {
        alert('이용약관에 동의해주세요.');
        return;
      }
      
      // 회원가입 처리 로직
      console.log('회원가입 시도:', { name, email, password, agreeTerms });
      
      // 여기에 실제 회원가입 API 호출 코드를 추가할 수 있습니다
      // 예시: fetch('/api/signup', { method: 'POST', body: JSON.stringify({ name, email, password }) })
      
      // 임시로 성공 메시지 표시
      alert('회원가입 요청이 전송되었습니다!');
    });

    // 입력 필드 포커스 효과
    document.querySelectorAll('.input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.classList.add('is-focused');
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.classList.remove('is-focused');
      });
    });

    // 비밀번호 확인 실시간 검증
    document.getElementById('confirmPassword').addEventListener('input', function() {
      const password = document.getElementById('password').value;
      const confirmPassword = this.value;
      
      if (confirmPassword && password !== confirmPassword) {
        this.classList.add('is-danger');
      } else {
        this.classList.remove('is-danger');
      }
    });
  </script>
</body>
</html>
