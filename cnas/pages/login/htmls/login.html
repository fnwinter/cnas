<style>
  .login-container { min-height: 100vh; }
  .login-box { background: white; border-radius: 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 2rem; }
</style>
<div class="login-container">
  <section class="hero is-fullheight">
    <div class="hero-body">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-4-desktop is-6-tablet">
            <div class="login-box">
              <div class="logo">
                <h1 class="title has-text-centered has-text-grey-dark">Login</h1>
                <p class="subtitle is-6 has-text-centered has-text-grey">Sign in with admin account</p>
              </div>

              <form id="loginForm">
                <div class="field">
                  <label class="label has-text-grey-dark">ID</label>
                  <div class="control">
                    <input class="input" type="text" id="login_id" placeholder="Admin ID" required>
                  </div>
                </div>

                <div class="field">
                  <label class="label has-text-grey-dark">Password</label>
                  <div class="control">
                    <input class="input" type="password" id="login_password" placeholder="••••••••" required>
                  </div>
                </div>

                <div class="field">
                  <div class="control">
                    <button type="submit" class="button is-primary is-fullwidth is-medium">Login</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var id = document.getElementById('login_id').value.trim();
    var password = document.getElementById('login_password').value;
    if (!id || !password) {
      alert('Please enter both ID and password.');
      return;
    }
    callPython('login', id, password);
  });
</script>
