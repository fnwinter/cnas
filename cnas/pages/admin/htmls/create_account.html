<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CNAS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.3/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .signup-container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .signup-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      padding: 2rem;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo i {
      font-size: 3rem;
      color: #667eea;
      margin-bottom: 1rem;
    }
    .field:not(:last-child) {
      margin-bottom: 1.5rem;
    }
    .button.is-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      transition: all 0.3s ease;
    }
    .button.is-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.125em rgba(102, 126, 234, 0.25);
    }
    .help-links {
      text-align: center;
      margin-top: 1.5rem;
    }
    .help-links a {
      color: #667eea;
      text-decoration: none;
      margin: 0 0.5rem;
      font-size: 0.9rem;
    }
    .help-links a:hover {
      text-decoration: underline;
    }
    .divider {
      margin: 1.5rem 0;
      text-align: center;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #dbdbdb;
    }
    .divider span {
      background: white;
      padding: 0 1rem;
      color: #7a7a7a;
      font-size: 0.9rem;
    }
    .password-requirements {
      font-size: 0.8rem;
      color: #7a7a7a;
      margin-top: 0.5rem;
    }
    .password-requirements ul {
      margin-left: 1rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <section class="hero is-fullheight">
      <div class="hero-body">
        <div class="container">
          <div class="columns is-centered">
            <div class="column is-4-desktop is-6-tablet">
              <div class="signup-box">
                <!-- Logo and title -->
                <div class="logo">
                  <i class="fas fa-user-plus"></i>
                  <h1 class="title has-text-centered has-text-grey-dark">Create Account</h1>
                  <p class="subtitle is-6 has-text-centered has-text-grey">Create a new CNAS account</p>
                </div>

                <!-- Signup form -->
                <form id="signupForm">
                  <!-- Name field -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-user"></i>
                      </span>
                      Name
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="text" 
                        id="name"
                        placeholder="John Doe" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-user"></i>
                      </span>
                    </div>
                  </div>

                  <!-- Email field -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-envelope"></i>
                      </span>
                      Email
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="email" 
                        id="email"
                        placeholder="example@email.com" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-envelope"></i>
                      </span>
                    </div>
                  </div>

                  <!-- Password field -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-lock"></i>
                      </span>
                      Password
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="password" 
                        id="password"
                        placeholder="••••••••" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-lock"></i>
                      </span>
                    </div>
                    <div class="password-requirements">
                      <p><strong>Password requirements:</strong></p>
                      <ul>
                        <li>At least 8 characters</li>
                        <li>Letters, numbers, and special characters</li>
                        <li>Include upper and lower case</li>
                      </ul>
                    </div>
                  </div>

                  <!-- Confirm password field -->
                  <div class="field">
                    <label class="label has-text-grey-dark">
                      <span class="icon is-small">
                        <i class="fas fa-check-circle"></i>
                      </span>
                      Confirm password
                    </label>
                    <div class="control has-icons-left">
                      <input 
                        class="input" 
                        type="password" 
                        id="confirmPassword"
                        placeholder="••••••••" 
                        required
                      >
                      <span class="icon is-small is-left">
                        <i class="fas fa-check-circle"></i>
                      </span>
                    </div>
                  </div>

                  <!-- Terms agreement checkbox -->
                  <div class="field">
                    <div class="control">
                      <label class="checkbox">
                        <input type="checkbox" id="agreeTerms" required>
                        I agree to the <a href="#" class="has-text-primary">Terms of Service</a> and <a href="#" class="has-text-primary">Privacy Policy</a>
                      </label>
                    </div>
                  </div>

                  <!-- Signup button -->
                  <div class="field">
                    <div class="control">
                      <button type="submit" class="button is-primary is-fullwidth is-medium">
                        <span class="icon">
                          <i class="fas fa-user-plus"></i>
                        </span>
                        <span>Create account</span>
                      </button>
                    </div>
                  </div>
                </form>

                <!-- Divider -->
                <div class="divider">
                  <span>or</span>
                </div>

                <!-- Help links -->
                <div class="help-links">
                  <a href="login.html">
                    <span class="icon is-small">
                      <i class="fas fa-sign-in-alt"></i>
                    </span>
                    Already have an account? Login
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- JavaScript -->
  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      
      // Password confirmation
      if (password !== confirmPassword) {
        alert('Passwords do not match.');
        return;
      }
      
      // Password strength check
      if (password.length < 8) {
        alert('Password must be at least 8 characters.');
        return;
      }
      
      // Terms agreement check
      if (!agreeTerms) {
        alert('Please agree to the terms of service.');
        return;
      }
      
      // Signup logic
      console.log('Signup attempt:', { name, email, password, agreeTerms });
      
      // Add actual signup API call here
      // e.g. fetch('/api/signup', { method: 'POST', body: JSON.stringify({ name, email, password }) })
      
      // Temporary success message
      alert('Signup request has been submitted!');
    });

    // Input field focus effect
    document.querySelectorAll('.input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.classList.add('is-focused');
      });
      
      input.addEventListener('blur', function() {
        this.parentElement.classList.remove('is-focused');
      });
    });

    // Real-time password confirmation validation
    document.getElementById('confirmPassword').addEventListener('input', function() {
      const password = document.getElementById('password').value;
      const confirmPassword = this.value;
      
      if (confirmPassword && password !== confirmPassword) {
        this.classList.add('is-danger');
      } else {
        this.classList.remove('is-danger');
      }
    });
  </script>
</body>
</html>
